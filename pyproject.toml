[tool.black]
line-length = 100
target-version = ["py311"]
# .venv-build/ is a build-time-only tool venv (datamodel-code-generator),
# never source; protocol/generated.py is ephemeral, regenerated by
# `deno run -A src/cli.ts generate-pytypes` (see .gitignore) — neither
# is hand-written Python this repo owns the formatting of.
extend-exclude = '''
(
  \.venv-build/
  | protocol/generated\.py
  | protocol/raw_generated\.py
  | generator/runtime/thinking\.py
  | runtime/generated\.py
  | fabric/generated\.py
)
'''

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv-build",
    "protocol/generated.py",
    "protocol/raw_generated.py",
    "generator/runtime/thinking.py",
    "runtime/generated.py",
    "fabric/generated.py",
]

[tool.ruff.lint]
# E/F: pycodestyle errors + pyflakes (real bugs, unused imports/vars).
# I: isort — import ordering, since black doesn't sort imports itself.
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Generated by primate: an id f-string is as long as the id; it is checked
# otherwise (pyflakes, mypy) and regenerated, never edited.
"fabric/rawir_learned.py" = ["E501"]

[tool.mypy]
# Static type check of ALL hand-written Python (tests included), strict:
# every function annotated, no bare generics, no implicit Any. This is
# what makes the typed IR mean something on this side — the deployer
# reads protocol/generated.py's dataclasses, and a field the protocol
# (src/protocol.ts) doesn't declare, or a kind-specific field read
# without checking `kind` first, fails HERE instead of at deploy time.
# protocol/generated.py is checked too (it is imported, and it is plain
# dataclasses) — so run `generate-pytypes` first, it is not committed.
strict = true
python_version = "3.11"
files = ["ladops", "deployer", "protocol", "reconciler", "raw_reconciler", "generator", "ovn_fabric", "runtime", "fabric", "primate"]
exclude = ['^\.venv-build/', '^generator/runtime/thinking\.py$']

# The old generated deployer is kept as reference only (ADR 0007): not
# kept working, so not type-checked (it predates logical addresses, ADR 0011).
[[tool.mypy.overrides]]
module = ["deployer.ir_to_python", "deployer.test_ir_to_python"]
ignore_errors = true

# mabels-ipaddress (requirements.txt) ships no type information (py.typed).
[[tool.mypy.overrides]]
module = ["ip_address", "ip_address.*"]
ignore_missing_imports = true
