<svg viewBox="0 0 880 445" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>ovn-fabric architecture</title>
  <desc>Data and control flow of ovn-fabric: topology.ts is evaluated by the TypeScript DSL in src/ into a flat Desired-State IR (JSON) whose ArkType schema in src/protocol.ts also generates typed Python dataclasses in protocol/. On each host, the fabric/ service runs on the generic runtime/ event runtime, plans and reconciles the IR using learned primitive templates from primate/ and live host snapshots from raw_reconciler/, and drives OVS, OVN, the Linux kernel, and Docker through ladops/.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#9333ea"/>
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- ==================== AUTHORING (TS / DENO) ==================== -->
    <rect x="16" y="24" width="176" height="236" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,3"/>
    <text x="28" y="43" fill="#64748b" font-size="11" font-weight="600" letter-spacing="0.3">AUTHORING (DENO / TS)</text>

    <!-- topology.ts -->
    <rect x="30" y="56" width="148" height="48" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="104" y="77" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">topology.ts</text>
    <text x="104" y="94" text-anchor="middle" fill="#64748b" font-size="10.5">declarative network</text>

    <!-- arrow topology.ts -> src/ -->
    <line x1="104" y1="104" x2="104" y2="128" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- src/ -->
    <rect x="30" y="130" width="148" height="54" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="104" y="152" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">src/ · toIR()</text>
    <text x="104" y="170" text-anchor="middle" fill="#64748b" font-size="10.5">DSL evaluator &amp; CLI</text>

    <!-- src/protocol.ts pill -->
    <rect x="30" y="206" width="148" height="38" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
    <text x="104" y="223" text-anchor="middle" fill="#1e40af" font-size="11.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">src/protocol.ts</text>
    <text x="104" y="237" text-anchor="middle" fill="#3b82f6" font-size="10">ArkType schema</text>

    <!-- ==================== CONTRACT / IR ==================== -->
    <!-- Desired-State IR -->
    <rect x="226" y="124" width="144" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="298" y="147" text-anchor="middle" fill="#1e3a8a" font-size="13.5" font-weight="700">Desired-State IR</text>
    <text x="298" y="164" text-anchor="middle" fill="#1d4ed8" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">JSON</text>
    <text x="298" y="179" text-anchor="middle" fill="#475569" font-size="10">flat {id, kind, key, data}</text>

    <!-- protocol/ -->
    <rect x="226" y="232" width="144" height="56" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="298" y="254" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">protocol/</text>
    <text x="298" y="270" text-anchor="middle" fill="#64748b" font-size="10">generated Python</text>
    <text x="298" y="281" text-anchor="middle" fill="#64748b" font-size="10">dataclasses</text>

    <!-- arrow src/ -> IR -->
    <line x1="178" y1="157" x2="224" y2="157" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>

    <!-- arrow src/protocol.ts -> protocol/ (codegen) -->
    <path d="M178,225 L202,225 L202,260 L224,260" fill="none" stroke="#3b82f6" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>
    <text x="200" y="274" text-anchor="middle" fill="#3b82f6" font-size="9.5">codegen</text>

    <!-- arrow protocol/ -> IR (typed load) -->
    <line x1="298" y1="232" x2="298" y2="192" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-blue)"/>
    <text x="305" y="216" fill="#3b82f6" font-size="9.5">validates</text>

    <!-- ==================== EACH HOST (PYTHON) ==================== -->
    <rect x="410" y="24" width="454" height="404" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5,3"/>
    <text x="424" y="43" fill="#64748b" font-size="11" font-weight="600" letter-spacing="0.3">EACH HOST (PYTHON)</text>

    <!-- arrow IR -> fabric/ -->
    <line x1="370" y1="157" x2="424" y2="157" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
    <text x="396" y="149" text-anchor="middle" fill="#2563eb" font-size="9.5">apply</text>

    <!-- fabric/ (top of host service stack) -->
    <path d="M426,64 Q426,56 434,56 L678,56 Q686,56 686,64 L686,198 L426,198 Z" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="440" y="76" fill="#0f172a" font-size="13.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">fabric/</text>
    <text x="502" y="76" fill="#64748b" font-size="11">ovn-fabric host service</text>

    <!-- fabric/ inner boxes -->
    <rect x="438" y="88" width="114" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="495" y="107" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">Services</text>
    <text x="495" y="123" text-anchor="middle" fill="#64748b" font-size="10">IR · pkgs · docker</text>

    <rect x="562" y="88" width="112" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="618" y="107" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">Plan &amp; Emit</text>
    <text x="618" y="123" text-anchor="middle" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">plan.py · emit/</text>

    <rect x="438" y="144" width="236" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="556" y="162" text-anchor="middle" fill="#1e3a8a" font-size="11.5" font-weight="600">Reconcile</text>
    <text x="556" y="177" text-anchor="middle" fill="#3b82f6" font-size="10">diff desired primitives vs live graph</text>

    <!-- runtime/ (foundation directly under fabric/) -->
    <path d="M426,198 L686,198 L686,238 Q686,246 678,246 L434,246 Q426,246 426,238 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1.3"/>
    <text x="440" y="218" fill="#0f172a" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">runtime/</text>
    <text x="510" y="218" fill="#475569" font-size="10.5">generic event runtime</text>
    <text x="440" y="235" fill="#475569" font-size="10">messages · peers · unix/TCP · jobs · journal</text>

    <!-- primate/ -->
    <rect x="716" y="56" width="134" height="72" rx="7" fill="#faf5ff" stroke="#9333ea" stroke-width="1.3"/>
    <text x="783" y="79" text-anchor="middle" fill="#581c87" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">primate/</text>
    <text x="783" y="96" text-anchor="middle" fill="#6b21a8" font-size="10">learned primitive</text>
    <text x="783" y="110" text-anchor="middle" fill="#6b21a8" font-size="10">RawIR templates</text>

    <!-- arrow primate/ -> fabric/ -->
    <line x1="716" y1="108" x2="688" y2="108" stroke="#9333ea" stroke-width="1.4" marker-end="url(#arrow-purple)"/>

    <!-- raw_reconciler/ -->
    <rect x="716" y="148" width="134" height="76" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
    <text x="783" y="171" text-anchor="middle" fill="#78350f" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">raw_reconciler/</text>
    <text x="783" y="189" text-anchor="middle" fill="#92400e" font-size="10">live host state as</text>
    <text x="783" y="203" text-anchor="middle" fill="#92400e" font-size="10">raw graph snapshot</text>

    <!-- arrow raw_reconciler/ -> fabric/ (Reconcile) -->
    <line x1="716" y1="168" x2="688" y2="168" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow-amber)"/>

    <!-- ladops/ -->
    <rect x="426" y="284" width="424" height="54" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <text x="442" y="306" fill="#064e3b" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ladops/</text>
    <text x="506" y="306" fill="#047857" font-size="11">typed system wrappers</text>
    <text x="442" y="325" fill="#065f46" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ip · ovs-vsctl · ovn-nbctl · OVSDB · nft/iptables · netns · docker</text>

    <!-- arrow fabric/stack -> ladops/ (drives) -->
    <line x1="556" y1="246" x2="556" y2="282" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="564" y="269" fill="#059669" font-size="10" font-weight="600">drives</text>

    <!-- arrow ladops/ -> raw_reconciler/ (reads) -->
    <line x1="783" y1="284" x2="783" y2="226" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
    <text x="791" y="260" fill="#d97706" font-size="10" font-weight="600">reads</text>

    <!-- Live System -->
    <rect x="426" y="366" width="424" height="46" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="1.2"/>
    <text x="638" y="388" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">OVS  ·  OVN  ·  Linux Kernel  ·  Docker</text>
    <text x="638" y="403" text-anchor="middle" fill="#94a3b8" font-size="10">live host dataplane &amp; workloads</text>

    <!-- bidirectional arrow ladops/ <-> Live System -->
    <line x1="638" y1="338" x2="638" y2="364" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  </g>
</svg>
