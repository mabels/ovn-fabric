title: ovn-fabric
description: Documentation and write-ups for ovn-fabric, a declarative OVN/OVS network fabric.
theme: minima

# Keep default (non-pretty) permalinks: the write-ups embed images with plain
# relative paths (e.g. diagram-topology-overview.svg next to the .md file).
# Pretty permalinks would nest the built page in its own directory and break
# those relative paths.

exclude:
  - Gemfile
  - Gemfile.lock
  - adr

# The pages in the site header, in this order.
header_pages:
  - guide/getting-started.md
  - guide/topology.md
  - reference.md
  - guide/deploying.md
  - guide/hosts.md
  - guide/troubleshooting.md
  - guide/architecture.md
