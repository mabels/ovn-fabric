name: QEMU VM
description: Start one QEMU VM with a NAT host NIC and an isolated OVN NIC.

inputs:
  name:
    description: VM name
    required: true
  hostname:
    description: Guest hostname (defaults to name)
    required: false
    default: ""
  image:
    description: Path to the base qcow2 cloud image
    required: true
  ssh-port:
    description: Local TCP port forwarded to the guest's SSH
    required: true
  ssh-user:
    description: Guest SSH user
    required: false
    default: alpine
  ssh-public-key:
    description: Path to the temporary public key injected into the guest
    required: true
  ssh-private-key:
    description: Path to the matching private key used to wait for SSH
    required: true
  host-mac:
    description: MAC address of the NAT host NIC
    required: true
  ovn-mac:
    description: MAC address of the isolated OVN NIC
    required: true
  ovn-name:
    description: Guest interface name for the OVN NIC (e.g. ovnkern); empty keeps the kernel name
    required: false
    default: ""
  ovn-mode:
    description: listen or connect on the OVN socket segment
    required: true
  ovn-port:
    description: Local TCP port of the OVN socket segment
    required: false
    default: "9000"
  memory:
    description: Guest memory in MiB
    required: false
    default: "512"
  cpus:
    description: Guest vCPUs
    required: false
    default: "2"
  timeout-seconds:
    description: How long to wait for cloud-init and SSH
    required: false
    default: "900"
  wait:
    description: Wait for SSH and the cloud-init marker before returning
    required: false
    default: "true"

outputs:
  pid:
    description: QEMU process id
    value: ${{ steps.start.outputs.pid }}
  workdir:
    description: Directory holding the overlay, seed, pidfile and serial log
    value: ${{ steps.start.outputs.workdir }}

runs:
  using: composite
  steps:
    - id: start
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        GUEST_HOSTNAME: ${{ inputs.hostname }}
        IMAGE: ${{ inputs.image }}
        SSH_PORT: ${{ inputs.ssh-port }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_PUB: ${{ inputs.ssh-public-key }}
        SSH_KEY: ${{ inputs.ssh-private-key }}
        HOST_MAC: ${{ inputs.host-mac }}
        OVN_MAC: ${{ inputs.ovn-mac }}
        OVN_NAME: ${{ inputs.ovn-name }}
        OVN_MODE: ${{ inputs.ovn-mode }}
        OVN_PORT: ${{ inputs.ovn-port }}
        MEMORY: ${{ inputs.memory }}
        CPUS: ${{ inputs.cpus }}
        TIMEOUT: ${{ inputs.timeout-seconds }}
        WAIT: ${{ inputs.wait }}
      run: |
        set -euo pipefail
        for tool in qemu-system-x86_64 qemu-img cloud-localds ssh; do
          command -v "$tool" >/dev/null || {
            echo "missing $tool" >&2
            exit 1
          }
        done

        work="$RUNNER_TEMP/qemu-$NAME"
        rm -rf "$work"
        mkdir -p "$work"
        guest_hostname="${GUEST_HOSTNAME:-$NAME}"
        pub="$(cat "$SSH_PUB")"

        cat >"$work/meta-data" <<EOF
        instance-id: $NAME
        local-hostname: $guest_hostname
        EOF

        cat >"$work/network-config" <<EOF
        version: 2
        ethernets:
          host:
            match: {macaddress: "$HOST_MAC"}
            addresses: [10.0.2.15/24]
            routes: [{to: 0.0.0.0/0, via: 10.0.2.2}]
            nameservers: {addresses: [10.0.2.3]}
            dhcp4: false
            dhcp6: false
        EOF
        if [ -n "$OVN_NAME" ]; then
          cat >>"$work/network-config" <<EOF
          $OVN_NAME:
            match: {macaddress: "$OVN_MAC"}
            set-name: $OVN_NAME
            dhcp4: false
            dhcp6: false
            accept-ra: false
        EOF
        fi

        cat >"$work/user-data" <<EOF
        #cloud-config
        hostname: $guest_hostname
        preserve_hostname: false
        users:
          - name: root
            ssh_authorized_keys:
              - $pub
        ssh_pwauth: false
        disable_root: false
        runcmd:
          - |
            if [ -n "$OVN_NAME" ]; then
              for i in /sys/class/net/*; do
                if [ "$(cat "\$i/address")" = "$OVN_MAC" ]; then
                  iface=\$(basename "\$i")
                  if [ "\$iface" != "$OVN_NAME" ]; then
                    ip link set "\$iface" down || true
                    ip link set "\$iface" name "$OVN_NAME" || true
                  fi
                  ip link set "$OVN_NAME" up || true
                fi
              done
            fi
            mkdir -p /root/.ssh
            printf '%s\n' "$pub" > /root/.ssh/authorized_keys
            chmod 700 /root/.ssh
            chmod 600 /root/.ssh/authorized_keys
            for f in /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf; do
              [ -f "\$f" ] || continue
              sed -i -E 's/^[[:space:]]*#?[[:space:]]*PermitRootLogin.*/PermitRootLogin prohibit-password/' "\$f"
            done
            systemctl restart ssh 2>/dev/null || systemctl restart sshd 2>/dev/null || true
            {
              echo "=== qemu test: users ==="
              id root || true
              echo "=== qemu test: sshd effective ==="
              sshd -T 2>&1 | grep -Ei '^(permitrootlogin|pubkeyauthentication|authorizedkeysfile|allowusers|denyusers|usepam|strictmodes|passwordauthentication)' || true
              echo "=== qemu test: keys ==="
              ls -ld /root /root/.ssh || true
              ls -l /root/.ssh/authorized_keys || true
              ssh-keygen -lf /root/.ssh/authorized_keys || true
              echo "=== qemu test: sshd procs ==="
              ps | grep -E '[s]shd' || true
              echo "=== qemu test: sshd config ==="
              grep -Ei 'permitrootlogin|authorizedkeysfile|allowusers|denyusers|^match' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null || true
            } >/dev/ttyS0 2>&1
            touch /var/run/qemu-ready
        EOF

        cloud-localds --network-config="$work/network-config" "$work/seed.iso" "$work/user-data" "$work/meta-data"
        qemu-img create -f qcow2 -b "$IMAGE" -F qcow2 "$work/overlay.qcow2" 4G >/dev/null

        qemu-system-x86_64 \
          -name "$NAME" \
          -machine pc \
          -accel tcg,thread=multi \
          -cpu max \
          -smp "$CPUS" \
          -m "$MEMORY" \
          -drive file="$work/overlay.qcow2",if=virtio,format=qcow2 \
          -drive file="$work/seed.iso",if=virtio,format=raw,readonly=on \
          -netdev user,id=hostnet,hostfwd=tcp:127.0.0.1:${SSH_PORT}-10.0.2.15:22 \
          -device virtio-net-pci,netdev=hostnet,mac="$HOST_MAC" \
          -netdev socket,id=ovnnet,${OVN_MODE}=127.0.0.1:${OVN_PORT} \
          -device virtio-net-pci,netdev=ovnnet,mac="$OVN_MAC" \
          -display none \
          -serial "file:$work/serial.log" \
          -monitor none \
          -daemonize \
          -pidfile "$work/qemu.pid" \
          -no-reboot

        pid="$(cat "$work/qemu.pid")"
        echo "pid=$pid" >>"$GITHUB_OUTPUT"
        echo "workdir=$work" >>"$GITHUB_OUTPUT"
        touch "$work/serial.log"

        if [ "$WAIT" != "true" ]; then
          echo "QEMU $NAME started on 127.0.0.1:$SSH_PORT"
          exit 0
        fi

        # Stream the guest serial console into the job log while we wait.
        tail -n +1 -F "$work/serial.log" 2>/dev/null | sed -u "s/^/[$NAME] /" &
        tail_pid=$!
        trap 'kill "$tail_pid" 2>/dev/null || true' EXIT

        deadline=$((SECONDS + TIMEOUT))
        attempt=0
        while [ "$SECONDS" -lt "$deadline" ]; do
          attempt=$((attempt + 1))
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "QEMU $NAME exited before it was ready" >&2
            tail -n 80 "$work/serial.log" >&2 || true
            exit 1
          fi

          set +e
          out="$(ssh -v -i "$SSH_KEY" -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=2 \
            "$SSH_USER@127.0.0.1" 'test -f /var/run/qemu-ready' 2>&1)"
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "QEMU $NAME ready on 127.0.0.1:$SSH_PORT"
            exit 0
          fi

          if [ $((attempt % 5)) -eq 1 ]; then
            if [ "$rc" -eq 255 ]; then
              echo "[$NAME] ssh $SSH_USER@127.0.0.1:$SSH_PORT attempt $attempt failed: ${out:-<no output>}" >&2
            else
              echo "[$NAME] ssh $SSH_USER@127.0.0.1:$SSH_PORT attempt $attempt connected, marker missing: ${out:-<no output>}" >&2
            fi
          fi
          sleep 2
        done

        echo "QEMU $NAME did not become ready within ${TIMEOUT}s" >&2
        tail -n 80 "$work/serial.log" >&2 || true
        exit 1
