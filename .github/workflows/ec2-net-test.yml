name: EC2 network smoke test

# Create a throwaway dual-stack EC2 pair per OS/arch, verify the Geneve L2
# bridge + IPv4 egress, then destroy everything.
#
# Two sequential loops (one process): launch all pairs (fast; AWS boots them
# concurrently), then wait/verify each pair. GitHub is cheap; AWS does the work.
#
# Auth: GitHub OIDC -> AWS role (variable AWS_ROLE_ARN).
# Cancel safety: matrix.ts traps SIGINT/SIGTERM and destroys; the teardown job
# is `if: always()`; ec2-reaper.yml catches hard cancellations every 15 min.

on:
  workflow_dispatch:
    inputs:
      ttl_minutes:
        description: "self-destruct pair + network after N minutes"
        default: "45"
      region:
        description: "AWS region"
        default: "eu-central-1"

permissions:
  id-token: write
  contents: read

concurrency:
  group: ec2-net-test-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.region || 'eu-central-1' }}
  RIG: rig-${{ github.run_id }}
  TTL_MINUTES: ${{ inputs.ttl_minutes || '45' }}

jobs:
  matrix:
    name: create + verify pairs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubAction
      - name: Launch all pairs, then verify each
        run: |
          deno run -A scripts/ec2-pair/matrix.ts \
            --rig "$RIG" \
            --suffix "${GITHUB_RUN_NUMBER}" \
            --ttl-minutes "$TTL_MINUTES" \
            --region "$AWS_REGION"

  teardown:
    name: teardown (always)
    needs: matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASES: |
        m-ub2404-x86
        m-ub2404-arm
        m-ub2604-x86
        m-ub2604-arm
        m-deb13-x86
        m-deb13-arm
        m-fed44-x86
        m-fed44-arm
        m-rocky10-x86
        m-rocky10-arm
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubAction
      - name: Destroy pairs and base network
        run: |
          set -uo pipefail
          for base in $BASES; do
            deno run -A scripts/ec2-pair/create-pair.ts \
              --pair "${base}-${GITHUB_RUN_NUMBER}" \
              --destroy --region "$AWS_REGION" || true
          done
          deno run -A scripts/ec2-pair/create-pair.ts \
            --pair "$RIG" --destroy --region "$AWS_REGION" || true
          deno run -A scripts/ec2-pair/create-pair.ts --reap --region "$AWS_REGION" || true
