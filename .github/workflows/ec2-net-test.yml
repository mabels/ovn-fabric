name: EC2 network smoke test

# Create a throwaway dual-stack EC2 pair per OS/arch, verify the Geneve L2
# bridge + IPv4 egress, then destroy everything.
#
# Two sequential loops (one process): launch all pairs (fast; AWS boots them
# concurrently), then wait/verify each pair. GitHub is cheap; AWS does the work.
#
# Auth: GitHub OIDC -> AWS role (variable AWS_ROLE_ARN).
# Cancel safety: matrix.ts traps SIGINT/SIGTERM and destroys; the teardown job
# is `if: always()`; ec2-reaper.yml catches hard cancellations every 15 min.

on:
  workflow_dispatch:
    inputs:
      ttl_minutes:
        description: "self-destruct pair + network after N minutes"
        default: "45"
      region:
        description: "AWS region"
        default: "eu-central-1"
      only:
        description: "matrix base or pair name, e.g. m-fed44-arm or m-fed44-arm-18 (empty = all)"
        default: ""
      vpc_id:
        description: "reuse this VPC (empty = create a per-run rig)"
        default: "vpc-de3591b6"
      subnet_id:
        description: "reuse this subnet"
        default: "subnet-29516963"
      sg_id:
        description: "reuse this security group (empty = per-run SG)"
        default: ""
      ip_base:
        description: "first private IPv4 (empty = derive from run number)"
        default: ""
      check_concurrency:
        description: "parallel L2 checks (0 = unlimited)"
        default: "0"
      deploy_concurrency:
        description: "parallel deploys (0 = unlimited)"
        default: "0"
      keep_failed:
        description: "leave failed pairs running (skips teardown)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: ec2-net-test-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.region || 'eu-central-1' }}
  RIG: rig-${{ github.run_id }}
  TTL_MINUTES: ${{ inputs.ttl_minutes || '45' }}

jobs:
  matrix:
    name: create + verify + deploy pairs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TOPOLOGY_SECRETS_TS: ${{ secrets.TOPOLOGY_SECRETS_TS }}
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Set up Python build venv
        run: |
          python3 -m venv .venv-build
          .venv-build/bin/pip install --quiet black ruff mypy -r requirements.txt
      - name: Generate Python protocol modules
        run: |
          deno run -A src/cli.ts generate-pytypes
          deno run -A runtime/schema/generate.ts
          deno run -A fabric/schema/generate.ts
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubAction
      - name: Launch all pairs, then verify each
        env:
          ONLY: ${{ inputs.only }}
          VPC_ID: ${{ inputs.vpc_id }}
          SUBNET_ID: ${{ inputs.subnet_id }}
          SG_ID: ${{ inputs.sg_id }}
          IP_BASE: ${{ inputs.ip_base }}
          CHECK_CONCURRENCY: ${{ inputs.check_concurrency }}
          DEPLOY_CONCURRENCY: ${{ inputs.deploy_concurrency }}
          KEEP_FAILED: ${{ inputs.keep_failed }}
        run: |
          set -euo pipefail
          args=(
            --rig "$RIG"
            --suffix "${GITHUB_RUN_NUMBER}"
            --ttl-minutes "$TTL_MINUTES"
            --region "$AWS_REGION"
            --check-concurrency "$CHECK_CONCURRENCY"
            --deploy-concurrency "$DEPLOY_CONCURRENCY"
          )
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ -n "$VPC_ID" ]; then
            args+=(--vpc-id "$VPC_ID")
            if [ -n "$SUBNET_ID" ]; then args+=(--subnet-id "$SUBNET_ID"); fi
            if [ -n "$SG_ID" ]; then args+=(--sg-id "$SG_ID"); fi
            if [ -z "$IP_BASE" ]; then
              IP_BASE="172.31.$((32 + GITHUB_RUN_NUMBER % 16)).10"
            fi
            args+=(--ip-base "$IP_BASE")
          fi
          if [ "$KEEP_FAILED" = "true" ]; then args+=(--keep-failed); fi
          deno run -A scripts/ec2-pair/matrix.ts "${args[@]}"

  teardown:
    name: teardown (always)
    needs: matrix
    if: ${{ always() && !inputs.keep_failed }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubAction
      - name: Terminate pairs + network (batched)
        run: |
          deno run -A scripts/ec2-pair/matrix.ts --teardown \
            --rig "$RIG" --suffix "${GITHUB_RUN_NUMBER}" \
            --region "$AWS_REGION"
