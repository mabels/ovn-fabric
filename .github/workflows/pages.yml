# Builds and deploys docs/ (Jekyll) plus the API reference (deno doc, under
# /api/) to GitHub Pages on every push to main.
# Requires one manual, one-time step in the repo:
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.1"
          bundler-cache: true
          cache-version: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        run: bundle exec jekyll build --source docs --destination _site --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      # The topology API reference, generated from the source's doc comments
      # (the package's public entry points, as deno.json exports them).
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
      - name: Install (pulls in `deno` as an npm dependency)
        run: npm install
      - name: Build the API reference
        run: npx deno doc --html --name="ovn-fabric" --output=_site/api src/mod.ts src/secret-types.ts
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
