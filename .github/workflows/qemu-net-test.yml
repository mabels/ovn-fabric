name: QEMU network smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu:
    name: QEMU ${{ matrix.distro }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            qemu_pkg: qemu-system-x86
            firmware: ""
            ctx: test
            hostname: net-test-hh-b
            id: ubuntu-x86
            distro: Ubuntu 26.04
            image_url: https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img
            tester_image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
          - arch: x86_64
            runner: ubuntu-latest
            qemu_pkg: qemu-system-x86
            firmware: ""
            ctx: test
            hostname: net-test-hh-b
            id: ubuntu2404-x86
            distro: Ubuntu 24.04
            image_url: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img
            tester_image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
          - arch: x86_64
            runner: ubuntu-latest
            qemu_pkg: qemu-system-x86
            firmware: ""
            ctx: test-c
            hostname: net-test-hh-c
            id: fedora-x86
            distro: Fedora 44
            image_url: https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2
            tester_image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
          - arch: x86_64
            runner: ubuntu-latest
            qemu_pkg: qemu-system-x86
            firmware: ""
            ctx: test-d
            hostname: net-test-hh-d
            id: debian-x86
            distro: Debian 13
            image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
            tester_image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
          - arch: x86_64
            runner: ubuntu-latest
            qemu_pkg: qemu-system-x86
            firmware: ""
            ctx: test-e
            hostname: net-test-hh-e
            id: rocky-x86
            distro: Rocky 10.3
            image_url: https://dl.rockylinux.org/pub/rocky/10.3/images/x86_64/Rocky-10-GenericCloud-Base-10.3-20261112.0.x86_64.qcow2
            tester_image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu_pkg: qemu-system-arm
            firmware: qemu-efi-aarch64
            ctx: test
            hostname: net-test-hh-b
            id: ubuntu-arm
            distro: Ubuntu 26.04
            image_url: https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-arm64.img
            tester_image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu_pkg: qemu-system-arm
            firmware: qemu-efi-aarch64
            ctx: test
            hostname: net-test-hh-b
            id: ubuntu2404-arm
            distro: Ubuntu 24.04
            image_url: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img
            tester_image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu_pkg: qemu-system-arm
            firmware: qemu-efi-aarch64
            ctx: test-c
            hostname: net-test-hh-c
            id: fedora-arm
            distro: Fedora 44
            image_url: https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/aarch64/images/Fedora-Cloud-Base-Generic-44-1.7.aarch64.qcow2
            tester_image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu_pkg: qemu-system-arm
            firmware: qemu-efi-aarch64
            ctx: test-d
            hostname: net-test-hh-d
            id: debian-arm
            distro: Debian 13
            image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2
            tester_image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu_pkg: qemu-system-arm
            firmware: qemu-efi-aarch64
            ctx: test-e
            hostname: net-test-hh-e
            id: rocky-arm
            distro: Rocky 10.3
            image_url: https://dl.rockylinux.org/pub/rocky/10.3/images/aarch64/Rocky-10-GenericCloud-Base-10.3-20261112.0.aarch64.qcow2
            tester_image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Python build venv
        run: |
          python3 -m venv .venv-build
          .venv-build/bin/pip install --quiet black ruff mypy -r requirements.txt

      - name: Generate Python protocol modules
        run: |
          deno run -A src/cli.ts generate-pytypes
          deno run -A runtime/schema/generate.ts
          deno run -A fabric/schema/generate.ts

      - name: Install QEMU and cloud-init tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils cloud-image-utils openssh-client ${{ matrix.qemu_pkg }} ${{ matrix.firmware }}

      - name: Temporary SSH key
        id: key
        run: |
          ssh-keygen -t ed25519 -N '' -f "$RUNNER_TEMP/qemu_key"
          echo "private=$RUNNER_TEMP/qemu_key" >> "$GITHUB_OUTPUT"
          echo "public=$RUNNER_TEMP/qemu_key.pub" >> "$GITHUB_OUTPUT"

      - name: Download tester Debian image
        run: |
          python3 - <<'PY'
          import os
          import urllib.request

          url = "${{ matrix.tester_image_url }}"
          dest = os.path.join(os.environ["RUNNER_TEMP"], "tester.qcow2")
          print("downloading", url, flush=True)
          urllib.request.urlretrieve(url, dest)
          print("tester image ok")
          PY

      - name: Download target cloud image
        run: |
          python3 - <<'PY'
          import os
          import urllib.request

          url = "${{ matrix.image_url }}"
          dest = os.path.join(os.environ["RUNNER_TEMP"], "target.qcow2")
          print("downloading", url, flush=True)
          urllib.request.urlretrieve(url, dest)
          print("target image ok")
          PY

      - name: Start tester QEMU
        id: vm
        uses: ./.github/actions/qemu-vm
        with:
          name: tester
          image: ${{ runner.temp }}/tester.qcow2
          arch: ${{ matrix.arch }}
          ssh-port: "2201"
          ssh-user: root
          ssh-public-key: ${{ steps.key.outputs.public }}
          ssh-private-key: ${{ steps.key.outputs.private }}
          host-mac: "52:54:00:00:00:01"
          wan-mac: "52:54:00:00:03:01"
          ovn-mac: "52:54:00:00:01:01"
          ovn-mode: listen
          ovn-port: "9000"
          timeout-seconds: "600"

      - name: Install tester netns tooling
        run: |
          ssh -i "$RUNNER_TEMP/qemu_key" -p 2201 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1 'export DEBIAN_FRONTEND=noninteractive; apt-get update; apt-get install -y iptables radvd iputils-ping dnsutils dhcpcd-base curl ca-certificates'

      - name: Inject and run tester netns setup
        run: |
          scp -i "$RUNNER_TEMP/qemu_key" -P 2201 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            .github/scripts/tester/test-isp.sh \
            .github/scripts/tester/test-segments.sh \
            root@127.0.0.1:/root/
          ssh -i "$RUNNER_TEMP/qemu_key" -p 2201 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1 'chmod +x /root/test-isp.sh /root/test-segments.sh; /root/test-segments.sh up; /root/test-isp.sh up'

      - name: Show ip a, netns and date
        run: |
          ssh -i "$RUNNER_TEMP/qemu_key" -p 2201 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1 'sh -s' <<'EOF'
          ip a
          echo ---
          ip netns ls
          for ns in $(ip netns ls | awk '{print $1}'); do
            echo "=== $ns"
            ip netns exec "$ns" ip a
          done
          echo ---
          date
          EOF

      - name: Start target QEMU
        id: target
        uses: ./.github/actions/qemu-vm
        with:
          name: ovn-fabric-${{ matrix.id }}
          hostname: ${{ matrix.hostname }}
          image: ${{ runner.temp }}/target.qcow2
          arch: ${{ matrix.arch }}
          memory: "1536"
          ssh-port: "2202"
          ssh-user: root
          ssh-public-key: ${{ steps.key.outputs.public }}
          ssh-private-key: ${{ steps.key.outputs.private }}
          host-mac: "52:54:00:00:02:01"
          ovn-mac: "52:54:00:00:01:02"
          ovn-name: ovnkern
          ovn-mode: connect
          ovn-port: "9000"
          timeout-seconds: "1200"

      - name: SSH root into target
        run: |
          ssh -i "$RUNNER_TEMP/qemu_key" -p 2202 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1 'hostname; ip a; echo ---; ip -br link; echo ---; date'

      - name: Configure SSH for the deploy target
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          cat >> "$HOME/.ssh/config" <<EOF
          Host 127.0.0.1
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile $RUNNER_TEMP/qemu_key
            IdentitiesOnly yes
          EOF

      - name: Verify tester/target OVN L2 link
        run: |
          ssh -i "$RUNNER_TEMP/qemu_key" -p 2202 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1 'ip link add link ovnkern name ovnkern.4000 type vlan id 4000; ip addr add 192.168.200.2/24 dev ovnkern.4000; ip link set ovnkern.4000 up'
          ssh -i "$RUNNER_TEMP/qemu_key" -p 2201 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1 'sh -s' <<'EOF'
          set -e
          ovn=$(ip -o link | awk '/52:54:00:00:01:01/ {gsub(":","",$2); print $2; exit}')
          [ -n "$ovn" ] || { echo "tester OVN NIC not found" >&2; exit 1; }
          ip netns del ns-link 2>/dev/null || true
          ip link del "$ovn.4000" 2>/dev/null || true
          ip netns add ns-link
          ip link add link "$ovn" name "$ovn.4000" type vlan id 4000
          ip link set "$ovn.4000" netns ns-link
          ip netns exec ns-link ip addr add 192.168.200.1/24 dev "$ovn.4000"
          ip netns exec ns-link ip link set "$ovn.4000" up
          ip netns exec ns-link ping -c 3 -W 2 192.168.200.2
          ip netns del ns-link
          EOF
          ssh -i "$RUNNER_TEMP/qemu_key" -p 2202 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1 'ip link del ovnkern.4000 2>/dev/null || true'

      - name: Deploy fabric to target
        env:
          # the secrets' TypeScript source; the topology imports it as a
          # data: module, nothing is written to disk
          TOPOLOGY_SECRETS_TS: ${{ secrets.TOPOLOGY_SECRETS_TS }}
        run: |
          deno run -A src/cli.ts generate-ir \
            --runtime ctx=${{ matrix.ctx }} examples/topology.cluster-tenants.ts \
            | scripts/fabric-deploy.sh root@127.0.0.1 --port 2202 ir-apply run --wait-background

      - name: Test connectivity from tester and ns-1129
        run: |
          ssh -i "$RUNNER_TEMP/qemu_key" -p 2201 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1 'sh -s' <<'EOF'
          fail=0
          run() {
            echo "=== $*"
            if "$@"; then
              echo "OK: $*"
            else
              rc=$?
              echo "FAIL($rc): $*"
              fail=1
            fi
          }

          echo "=== tester root"
          run curl -fsS --max-time 15 -o /dev/null -w 'tester-https=%{http_code}\n' https://www.google.com/

          echo "=== ns-1129"
          mkdir -p /etc/netns/ns-1129
          printf 'nameserver 10.43.0.10\n' > /etc/netns/ns-1129/resolv.conf
          run ip netns exec ns-1129 ping -c 3 -W 2 192.168.129.1
          run ip netns exec ns-1129 ping -c 3 -W 2 100.64.0.1
          run ip netns exec ns-1129 dig @10.43.0.10 www.geo.de
          run ip netns exec ns-1129 curl -fsS --max-time 15 -o /dev/null -w 'ns-1129-https=%{http_code}\n' https://www.google.com/

          exit "$fail"
          EOF

      - name: Cleanup
        if: always()
        run: |
          for pid in "${{ steps.vm.outputs.pid }}" "${{ steps.target.outputs.pid }}"; do
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
            fi
          done
          pkill -f 'qemu-system-.*tester' 2>/dev/null || true
          pkill -f 'qemu-system-.*ovn-fabric-' 2>/dev/null || true
