name: QEMU network smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install QEMU and cloud-init tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 cloud-image-utils openssh-client

      - name: Temporary SSH key
        id: key
        run: |
          ssh-keygen -t ed25519 -N '' -f "$RUNNER_TEMP/qemu_key"
          echo "private=$RUNNER_TEMP/qemu_key" >> "$GITHUB_OUTPUT"
          echo "public=$RUNNER_TEMP/qemu_key.pub" >> "$GITHUB_OUTPUT"

      - name: Download Alpine cloud image
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import urllib.request

          base = "https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/cloud/"
          name = "nocloud_alpine-3.22.4-x86_64-bios-cloudinit-r0.qcow2"
          dest = os.path.join(os.environ["RUNNER_TEMP"], "alpine.qcow2")
          urllib.request.urlretrieve(base + name, dest)
          expected = urllib.request.urlopen(
              base + name + ".sha512", timeout=60
          ).read().decode().split()[0]
          digest = hashlib.sha512()
          with open(dest, "rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
          if digest.hexdigest() != expected:
              raise SystemExit("alpine image checksum mismatch")
          print("alpine image ok")
          PY

      - name: Start first QEMU (OVN listen)
        id: vm1
        uses: ./.github/actions/qemu-vm
        with:
          name: ovn-a
          image: ${{ runner.temp }}/alpine.qcow2
          ssh-port: "2201"
          ssh-public-key: ${{ steps.key.outputs.public }}
          ssh-private-key: ${{ steps.key.outputs.private }}
          host-mac: "52:54:00:00:00:01"
          ovn-mac: "52:54:00:00:01:01"
          ovn-mode: listen
          ovn-port: "9000"
          wait: "false"

      - name: Start second QEMU (OVN connect)
        id: vm2
        uses: ./.github/actions/qemu-vm
        with:
          name: ovn-b
          image: ${{ runner.temp }}/alpine.qcow2
          ssh-port: "2202"
          ssh-public-key: ${{ steps.key.outputs.public }}
          ssh-private-key: ${{ steps.key.outputs.private }}
          host-mac: "52:54:00:00:00:02"
          ovn-mac: "52:54:00:00:01:02"
          ovn-mode: connect
          ovn-port: "9000"
          wait: "false"

      - name: Stream consoles and wait for both guests
        run: |
          set -euo pipefail
          cleanup() {
            kill "$tail1" "$tail2" 2>/dev/null || true
          }
          trap cleanup EXIT

          work1="${{ steps.vm1.outputs.workdir }}"
          work2="${{ steps.vm2.outputs.workdir }}"
          pid1="${{ steps.vm1.outputs.pid }}"
          pid2="${{ steps.vm2.outputs.pid }}"

          tail -n +1 -F "$work1/serial.log" 2>/dev/null | sed -u 's/^/[ovn-a] /' &
          tail1=$!
          tail -n +1 -F "$work2/serial.log" 2>/dev/null | sed -u 's/^/[ovn-b] /' &
          tail2=$!

          deadline=$((SECONDS + 900))
          for entry in "$pid1:$work1:2201:ovn-a" "$pid2:$work2:2202:ovn-b"; do
            pid="${entry%%:*}"
            rest="${entry#*:}"
            work="${rest%%:*}"
            rest="${rest#*:}"
            port="${rest%%:*}"
            name="${rest##*:}"
            echo "waiting for $name"
            until ssh -i "$RUNNER_TEMP/qemu_key" -p "$port" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=2 \
              alpine@127.0.0.1 'test -f /var/run/qemu-ready' >/dev/null 2>&1; do
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "$name exited before it was ready" >&2
                tail -n 80 "$work/serial.log" >&2 || true
                exit 1
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "timed out waiting for $name" >&2
                tail -n 80 "$work/serial.log" >&2 || true
                exit 1
              fi
              sleep 2
            done
            echo "$name ready"
          done

      - name: Show ip a and date on both guests
        run: |
          for entry in "2201:ovn-a" "2202:ovn-b"; do
            port="${entry%%:*}"
            name="${entry##*:}"
            echo "=== $name"
            ssh -i "$RUNNER_TEMP/qemu_key" -p "$port" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              alpine@127.0.0.1 'ip a; echo ---; date'
          done

      - name: Cleanup
        if: always()
        run: |
          for pid in "${{ steps.vm1.outputs.pid }}" "${{ steps.vm2.outputs.pid }}"; do
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
            fi
          done
          pkill -f 'qemu-system-x86_64.*ovn-' 2>/dev/null || true
