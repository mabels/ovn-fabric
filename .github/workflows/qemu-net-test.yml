name: QEMU network smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Write topology secrets
        env:
          TOPOLOGY_SECRETS_TS: ${{ secrets.TOPOLOGY_SECRETS_TS }}
        run: |
          umask 077
          printf '%s\n' "$TOPOLOGY_SECRETS_TS" > examples/topology.cluster-tenants.secrets.ts
          chmod 600 examples/topology.cluster-tenants.secrets.ts

      - name: Set up Python build venv
        run: |
          python3 -m venv .venv-build
          .venv-build/bin/pip install --quiet black ruff mypy -r requirements.txt

      - name: Generate Python protocol modules
        run: |
          deno run -A src/cli.ts generate-pytypes
          deno run -A runtime/schema/generate.ts
          deno run -A fabric/schema/generate.ts

      - name: Install QEMU and cloud-init tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 cloud-image-utils openssh-client

      - name: Temporary SSH key
        id: key
        run: |
          ssh-keygen -t ed25519 -N '' -f "$RUNNER_TEMP/qemu_key"
          echo "private=$RUNNER_TEMP/qemu_key" >> "$GITHUB_OUTPUT"
          echo "public=$RUNNER_TEMP/qemu_key.pub" >> "$GITHUB_OUTPUT"

      - name: Download Alpine cloud image
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import urllib.request

          base = "https://cloud.debian.org/images/cloud/trixie/latest/"
          name = "debian-13-genericcloud-amd64.qcow2"
          dest = os.path.join(os.environ["RUNNER_TEMP"], "debian.qcow2")
          urllib.request.urlretrieve(base + name, dest)
          sums = urllib.request.urlopen(base + "SHA512SUMS", timeout=60).read().decode()
          expected = next(
              line.split()[0] for line in sums.splitlines() if name in line
          )
          digest = hashlib.sha512()
          with open(dest, "rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
          if digest.hexdigest() != expected:
              raise SystemExit("debian image checksum mismatch")
          print("debian image ok")
          PY

      - name: Start tester QEMU
        id: vm
        uses: ./.github/actions/qemu-vm
        with:
          name: tester
          image: ${{ runner.temp }}/debian.qcow2
          ssh-port: "2201"
          ssh-user: root
          ssh-public-key: ${{ steps.key.outputs.public }}
          ssh-private-key: ${{ steps.key.outputs.private }}
          host-mac: "52:54:00:00:00:01"
          ovn-mac: "52:54:00:00:01:01"
          ovn-mode: listen
          ovn-port: "9000"
          timeout-seconds: "300"

      - name: Install tester netns tooling
        run: |
          ssh -i "$RUNNER_TEMP/qemu_key" -p 2201 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1 'export DEBIAN_FRONTEND=noninteractive; apt-get update; apt-get install -y iptables radvd'

      - name: Inject and run tester netns setup
        run: |
          scp -i "$RUNNER_TEMP/qemu_key" -P 2201 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            .github/scripts/tester/test-isp.sh \
            .github/scripts/tester/test-segments.sh \
            root@127.0.0.1:/root/
          ssh -i "$RUNNER_TEMP/qemu_key" -p 2201 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1 'chmod +x /root/test-isp.sh /root/test-segments.sh; /root/test-segments.sh up; /root/test-isp.sh up'

      - name: Show ip a, netns and date
        run: |
          ssh -i "$RUNNER_TEMP/qemu_key" -p 2201 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1 'sh -s' <<'EOF'
          ip a
          echo ---
          ip netns ls
          for ns in $(ip netns ls | awk '{print $1}'); do
            echo "=== $ns"
            ip netns exec "$ns" ip a
          done
          echo ---
          date
          EOF

      - name: Start ovn-fabric-debian QEMU
        id: target
        uses: ./.github/actions/qemu-vm
        with:
          name: ovn-fabric-debian
          image: ${{ runner.temp }}/debian.qcow2
          ssh-port: "2202"
          ssh-user: root
          ssh-public-key: ${{ steps.key.outputs.public }}
          ssh-private-key: ${{ steps.key.outputs.private }}
          host-mac: "52:54:00:00:02:01"
          ovn-mac: "52:54:00:00:01:02"
          ovn-name: ovnkern
          ovn-mode: connect
          ovn-port: "9000"
          timeout-seconds: "600"

      - name: SSH root into ovn-fabric-debian
        run: |
          ssh -i "$RUNNER_TEMP/qemu_key" -p 2202 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1 'hostname; ip a; echo ---; ip -br link; echo ---; date'

      - name: Configure SSH for the deploy target
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          cat >> "$HOME/.ssh/config" <<EOF
          Host 127.0.0.1
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile $RUNNER_TEMP/qemu_key
            IdentitiesOnly yes
          EOF

      - name: Deploy fabric to ovn-fabric-debian
        run: |
          deno run -A src/cli.ts generate-ir \
            --runtime ctx=test-e examples/topology.cluster-tenants.ts \
            | scripts/fabric-deploy.sh root@127.0.0.1 --port 2202 ir-apply run

      - name: Cleanup
        if: always()
        run: |
          for pid in "${{ steps.vm.outputs.pid }}" "${{ steps.target.outputs.pid }}"; do
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
            fi
          done
          pkill -f 'qemu-system-x86_64.*tester' 2>/dev/null || true
          pkill -f 'qemu-system-x86_64.*ovn-fabric-debian' 2>/dev/null || true
